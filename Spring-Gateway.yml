server:
  port: 8000

  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  cloud:
    gateway:

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

      globalcors:
        add-to-simple-url-handler-mapping: true

        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - ${GATEWAY_URL:http://localhost:4200}

            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS

            allowedHeaders:
              - "*"

            exposedHeaders:
              - X-Total-Count

            allowCredentials: true

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

          predicates:
            - name: Path
              args:
                pattern: "'/services/'+serviceId.toLowerCase()+'/**'"

          filters:
            - name: RewritePath
              args:
                regexp: "'/services/' + serviceId.toLowerCase() + '/(?<remaining>.*)'"
                replacement: "'/${remaining}'"

      httpclient:
        pool:
          max-connections: 1000


eureka:
  client:
    service-url:
      defaultZone: http://${REGISTRY_HOST:localhost}:8761/eureka/

    enabled: true
    fetch-registry: true
    register-with-eureka: true

    healthcheck:
      enabled: true

    instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 10

  instance:
    appname: Spring-Gateway

    instanceId: Spring-Gateway:${spring.application.instance-id:${random.value}}

    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10


springdoc:
  enable-native-support: true

  api-docs:
    enabled: true

  swagger-ui:
    enabled: true

    path: /services/swagger-ui.html

    config-url: /v3/api-docs/swagger-config

    urls:
      - url: /v3/api-docs
        name: API Gateway Service

      - url: /services/spkycmsclient/v3/api-docs
        name: spkycmsclient

      - url: /services/spkycmsconfig/v3/api-docs
        name: spkycmsconfig

      - url: /services/spkycmsuaa/v3/api-docs
        name: spkycmsuaa