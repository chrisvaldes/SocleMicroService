spring:
  application:
    name: msclient

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/msclient?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=Africa/Douala&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update

  kafka:
    # l'application tourne sur le port 9092 notre serveur/cluster
    bootstrap-servers: localhost:9092

    producer:
      # il faut savoir que les messages dans kafka sont des chaines de caractère,
      # donc il faut pouvoir sérialiser nos objet pour les transportés sur KAFKA
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    properties:
      # Ici, on précise de ne pas mettre les types dans le headers
      spring.json.add.type.headers: true
      # acknowledge à all pour une durée maximal
      acks: all
      retries: 3

kafka:
  topics:
    clients: client.created

server:
  port: 8003

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://${REGISTRY_HOST:localhost}:8761/eureka/

  instance:
    prefer-ip-address: true
    appname: msclient
    instanceId: msclient:${spring.application.instance-id:${random.value}}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html